name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unzip project
        run: unzip -o ios27-launcher.zip -d project
      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk iOS27-Launcher.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: iOS 27 Launcher v1.0.${{ github.run_number }}
          files: iOS27-Launcher.apk
          make_latest: true
